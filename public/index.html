<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand-block">
          <p class="eyebrow">3-tier application</p>
          <h1>TaskFlow</h1>
        </div>

        <form id="task-form" class="panel">
          <h2>Create task</h2>

          <label>
            <span>Title</span>
            <input id="title" name="title" type="text" maxlength="120" required />
          </label>

          <label>
            <span>Description</span>
            <textarea id="description" name="description" rows="3" maxlength="500"></textarea>
          </label>

          <div class="inline-fields">
            <label>
              <span>Priority</span>
              <select id="priority" name="priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </label>

            <label>
              <span>Due date</span>
              <input id="dueDate" name="dueDate" type="date" />
            </label>
          </div>

          <button type="submit" class="primary-button">Add task</button>
          <p id="message" class="message" role="status"></p>
        </form>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Operations board</p>
            <h2>Team tasks</h2>
          </div>
        </header>

        <section class="filters panel">
          <div class="filter-tools">
            <label>
              <span>Search</span>
              <input id="search" type="search" placeholder="Search by title or description" />
            </label>

            <label>
              <span>Status</span>
              <select id="statusFilter">
                <option value="all">All</option>
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
              </select>
            </label>
          </div>
        </section>

        <section class="list-panel">
          <div class="list-header">
            <h3>Task list</h3>
            <span id="task-count">0 tasks</span>
          </div>
          <ul id="task-list" class="task-list"></ul>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
